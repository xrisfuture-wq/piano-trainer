<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>AI 鋼琴瀑布流練彈器 (PWA App)</title>
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#0b0f17">
<style>
  :root {
    --bg: #0b0f17;
    --panel: #151c28;
    --border: #263248;
    --rh: #00e5ff;
    --lh: #ff9d00;
    --text: #f1f5f9;
    --sub: #94a3b8;
    --accent: #3b82f6;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    height: 100dvh; width: 100vw; overflow: hidden;
    display: flex; flex-direction: column;
  }
  .top-bar {
    background: var(--panel); border-bottom: 1px solid var(--border);
    padding: 6px 10px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center;
    justify-content: space-between; z-index: 20;
  }
  .input-group {
    display: flex; gap: 6px; flex: 1; min-width: 260px; align-items: center;
  }
  input[type="text"] {
    background: #090d14; border: 1px solid var(--border); color: var(--text);
    padding: 6px 10px; border-radius: 6px; font-size: 13px; flex: 1; min-width: 140px;
  }
  button, .btn-label {
    background: #1e293b; color: var(--text); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 6px; font-size: 12px; font-weight: 600;
    cursor: pointer; display: inline-flex; align-items: center; gap: 4px;
    white-space: nowrap; transition: 0.15s;
  }
  button:active, .btn-label:active { transform: scale(0.96); }
  button.primary { background: var(--accent); border-color: #60a5fa; color: #fff; }
  button.active { background: #0284c7; border-color: #38bdf8; color: #fff; }
  .lv-group { display: flex; gap: 3px; background: #090d14; padding: 3px; border-radius: 7px; border: 1px solid var(--border); }
  .lv-btn { padding: 4px 8px; font-size: 11px; border: none; background: transparent; color: var(--sub); }
  .lv-btn.active { background: linear-gradient(135deg, #2563eb, #06b6d4); color: #fff; border-radius: 5px; }

  .ctrl-bar {
    background: #101622; border-bottom: 1px solid var(--border);
    padding: 5px 10px; display: flex; gap: 8px; align-items: center; justify-content: space-between;
    font-size: 12px; overflow-x: auto;
  }
  .song-badge { display: flex; align-items: center; gap: 8px; font-weight: 600; color: #38bdf8; }
  .progress-wrap { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 150px; }
  input[type="range"] { flex: 1; accent-color: var(--rh); height: 5px; cursor: pointer; }

  .stage { position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  #waterfallCanvas { width: 100%; height: 76%; display: block; background: radial-gradient(circle at 50% 100%, #131c2e 0%, #070a10 85%); }
  #keyboardCanvas { width: 100%; height: 24%; display: block; background: #05070b; touch-action: none; border-top: 2px solid #00e5ff55; }

  .hud-pill {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(15, 23, 42, 0.82); backdrop-filter: blur(8px);
    border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 999px;
    padding: 6px 18px; display: flex; gap: 14px; align-items: center;
    pointer-events: none; z-index: 10; box-shadow: 0 4px 20px rgba(0,0,0,0.5);
  }
  .hud-chord { font-size: 16px; font-weight: 800; color: #fbbf24; }
  .hud-lyric { font-size: 14px; font-weight: 600; color: #f8fafc; letter-spacing: 0.5px; }
  .hud-sec { font-size: 11px; background: #1e293b; color: #38bdf8; padding: 2px 8px; border-radius: 12px; }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    display: none; align-items: center; justify-content: center; z-index: 100; padding: 16px;
  }
  .modal.show { display: flex; }
  .modal-card {
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    max-width: 500px; width: 100%; padding: 18px; display: flex; flex-direction: column; gap: 12px;
  }
</style>
</head>
<body>

<div class="top-bar">
  <div class="input-group">
    <input type="text" id="urlInput" value="https://youtu.be/qsKRk3ErGWk?si=fCxpw59AXDQM28_0" placeholder="貼上 YouTube 網址或選擇曲目...">
    <button class="primary" id="parseUrlBtn">✨ 載入轉譯</button>
    <label class="btn-label" title="匯入 .mid 檔">
      📂 匯入 .mid
      <input type="file" id="midiFileInput" accept=".mid,.midi" style="display:none">
    </label>
    <button id="cloudCfgBtn">☁️ 雲端API</button>
  </div>

  <div style="display:flex; gap:6px; align-items:center; flex-wrap:wrap;">
    <select id="presetSelect" style="background:#090d14; color:#fff; border:1px solid var(--border); padding:5px 8px; border-radius:6px; font-size:12px;">
      <option value="twilight">🎹 林俊傑 - 不為誰而作的歌</option>
      <option value="rencuo">🎹 優客李林 - 認錯</option>
    </select>

    <div class="lv-group">
      <button class="lv-btn" data-lv="1">Lv1</button>
      <button class="lv-btn" data-lv="2">Lv2</button>
      <button class="lv-btn" data-lv="3">Lv3</button>
      <button class="lv-btn" data-lv="4">Lv4</button>
      <button class="lv-btn active" data-lv="5">Lv5 演奏級</button>
    </div>

    <button id="exportMidiBtn">💾 匯出 MIDI</button>
    <button id="fsBtn">⛶ 全螢幕</button>
  </div>
</div>

<div class="ctrl-bar">
  <div class="song-badge">
    <span id="songTitleDisplay">林俊傑 JJ Lin – 不為誰而作的歌</span>
  </div>

  <div class="progress-wrap">
    <button class="primary" id="playBtn">▶ 播放</button>
    <button id="restartBtn">⏮</button>
    <input type="range" id="seekSlider" min="0" max="1000" value="0">
    <span id="timeDisplay" style="font-variant-numeric:tabular-nums;">00:00 / 00:00</span>
  </div>

  <div style="display:flex; gap:5px; align-items:center;">
    <button class="active" id="rhToggle" style="border-color:var(--rh)">右手</button>
    <button class="active" id="lhToggle" style="border-color:var(--lh)">左手</button>
    <select id="speedSelect" style="background:#090d14; color:#fff; border:1px solid var(--border); padding:4px 6px; border-radius:6px; font-size:12px;">
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1.0x</option>
    </select>
    <button id="labelModeBtn">簡譜 1-7</button>
  </div>
</div>

<div class="stage">
  <div class="hud-pill">
    <span class="hud-sec" id="hudSection">前奏 Intro</span>
    <span class="hud-chord" id="hudChord">Gmaj7</span>
    <span class="hud-lyric" id="hudLyric">（純鋼琴前奏）</span>
  </div>
  <canvas id="waterfallCanvas"></canvas>
  <canvas id="keyboardCanvas"></canvas>
</div>

<div class="modal" id="cloudModal">
  <div class="modal-card">
    <h3 style="color:#38bdf8;">☁️ Google Colab 雲端扒譜 API</h3>
    <input type="text" id="colabUrlInput" placeholder="https://xxxx.gradio.live">
    <div style="display:flex; justify-content:flex-end; gap:8px;">
      <button id="closeModalBtn">關閉</button>
      <button class="primary" id="saveColabBtn">儲存</button>
    </div>
  </div>
</div>

<script>
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('./sw.service.worker.js').catch(() => {});
}

class GrandPianoAudio {
  constructor() { this.ctx = null; this.masterGain = null; this.reverbNode = null; }
  init() {
    if (!this.ctx) {
      const AudioCtx = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AudioCtx();
      this.masterGain = this.ctx.createGain();
      this.masterGain.gain.value = 0.55;
      const sampleRate = this.ctx.sampleRate;
      const length = sampleRate * 2.2;
      const impulse = this.ctx.createBuffer(2, length, sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const data = impulse.getChannelData(ch);
        for (let i = 0; i < length; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / length, 2.8);
      }
      this.reverbNode = this.ctx.createConvolver();
      this.reverbNode.buffer = impulse;
      const wetGain = this.ctx.createGain();
      wetGain.gain.value = 0.28;
      this.masterGain.connect(this.ctx.destination);
      this.masterGain.connect(this.reverbNode);
      this.reverbNode.connect(wetGain);
      wetGain.connect(this.ctx.destination);
    }
    if (this.ctx.state === 'suspended') this.ctx.resume();
  }
  playNote(midi, duration = 0.8, velocity = 0.8) {
    this.init();
    const now = this.ctx.currentTime;
    const freq = 440 * Math.pow(2, (midi - 69) / 12);
    const noteGain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(freq * (3.5 + velocity * 5), now);
    const osc1 = this.ctx.createOscillator();
    const osc2 = this.ctx.createOscillator();
    osc1.type = 'triangle'; osc2.type = 'sine';
    osc1.frequency.setValueAtTime(freq, now);
    osc2.frequency.setValueAtTime(freq * 2, now);
    const g1 = this.ctx.createGain(); const g2 = this.ctx.createGain();
    g1.gain.value = 0.75; g2.gain.value = 0.22;
    const peak = Math.min(0.45, velocity * 0.42);
    const release = Math.min(Math.max(duration * 1.35, 0.45), 2.8);
    noteGain.gain.setValueAtTime(0.0001, now);
    noteGain.gain.linearRampToValueAtTime(peak, now + 0.008);
    noteGain.gain.exponentialRampToValueAtTime(0.0001, now + release);
    osc1.connect(g1); osc2.connect(g2);
    g1.connect(filter); g2.connect(filter);
    filter.connect(noteGain); noteGain.connect(this.masterGain);
    osc1.start(now); osc2.start(now);
    osc1.stop(now + release + 0.05); osc2.stop(now + release + 0.05);
  }
}
const audio = new GrandPianoAudio();

function n(noteStr) {
  const map = { 'C':0, 'C#':1, 'Db':1, 'D':2, 'D#':3, 'Eb':3, 'E':4, 'F':5, 'F#':6, 'Gb':6, 'G':7, 'G#':8, 'Ab':8, 'A':9, 'A#':10, 'Bb':10, 'B':11 };
  const m = noteStr.match(/^([A-G][#b]?)(-?\d+)$/);
  if (!m) return 60;
  return (parseInt(m[2], 10) + 1) * 12 + map[m[1]];
}

function buildTwilightAuthenticScore(level = 5) {
  const bpm = 69; const spb = 60 / bpm; const notes = []; const markers = [];
  const add = (beat, durBeats, pitchStr, hand, vel = 0.8, minLv = 1) => {
    if (level < minLv) return;
    notes.push({ time: beat * spb, duration: durBeats * spb, midi: typeof pitchStr === 'number' ? pitchStr : n(pitchStr), hand, velocity: vel, played: false });
  };
  const addLH = (barIdx, rootLow, fifth, octave, tenth, chordName, secName, lyricText) => {
    const b = barIdx * 4;
    markers.push({ time: b * spb, chord: chordName, section: secName, lyric: lyricText });
    if (level === 1) add(b, 4, octave, 'L', 0.65, 1);
    else if (level <= 3) { add(b, 2, octave, 'L', 0.68, 1); add(b + 2, 2, fifth, 'L', 0.65, 1); }
    else {
      add(b, 1.5, rootLow, 'L', 0.78, 1);
      if (level >= 5) add(b, 1.5, octave, 'L', 0.68, 5);
      add(b + 0.5, 0.5, fifth, 'L', 0.64, 4); add(b + 1.0, 0.5, octave, 'L', 0.68, 4);
      add(b + 1.5, 0.5, tenth, 'L', 0.70, 4); add(b + 2.0, 0.5, octave, 'L', 0.65, 4);
      add(b + 2.5, 0.5, fifth, 'L', 0.62, 4); add(b + 3.0, 1.0, octave, 'L', 0.66, 4);
    }
  };
  const addMel = (beat, dur, mainNote, innerNote, vel = 0.88) => {
    add(beat, dur, mainNote, 'R', vel, 1);
    if (innerNote && level >= 3) add(beat, dur, innerNote, 'R', vel * 0.78, 3);
    if (level >= 5 && n(mainNote) >= 66) add(beat, dur, n(mainNote) + 12, 'R', vel * 0.85, 5);
  };

  addLH(0, 'G2', 'D3', 'G3', 'B3', 'Gmaj7', '前奏 Intro', '（前奏：D大調晶瑩高音分解和弦）');
  add(0.0, 0.5, 'F#5', 'R', 0.82, 1); add(0.5, 0.5, 'D5', 'R', 0.74, 2); add(1.0, 0.5, 'A4', 'R', 0.72, 2); add(1.5, 0.5, 'D5', 'R', 0.76, 1);
  add(2.0, 1.0, 'F#5', 'R', 0.85, 1); add(3.0, 0.5, 'G5', 'R', 0.82, 1); add(3.5, 0.5, 'F#5', 'R', 0.78, 1);

  addLH(1, 'G2', 'E3', 'A3', 'C#4', 'A/G', '前奏 Intro', '（前奏：A/G 懸留和聲）');
  add(4.0, 1.0, 'E5', 'R', 0.84, 1); add(5.0, 0.5, 'A4', 'R', 0.72, 2); add(6.0, 1.0, 'E5', 'R', 0.85, 1); add(7.0, 0.5, 'F#5', 'R', 0.82, 1);

  addLH(2, 'F#2', 'C#3', 'F#3', 'A3', 'F#m7', '前奏 Intro', '（前奏：F#m7 內省鋪陳）');
  add(8.0, 1.0, 'D5', 'R', 0.82, 1); add(9.0, 0.5, 'F#4', 'R', 0.70, 2); add(10.0, 1.0, 'D5', 'R', 0.84, 1); add(11.0, 0.5, 'E5', 'R', 0.80, 1);

  addLH(3, 'B1', 'F#2', 'B2', 'D3', 'Bm7', '前奏 Intro', '（準備進入主歌...）');
  add(12.0, 1.5, 'C#5', 'R', 0.80, 1); add(14.0, 2.0, 'A4', 'R', 0.82, 1);

  addLH(4, 'G2', 'D3', 'G3', 'B3', 'Gmaj7', '主歌 Verse', '原諒我這一首 不為誰而作的歌');
  addMel(17.0, 0.5, 'F#4', 'D4', 0.82); addMel(18.0, 0.75, 'A4', 'D4', 0.86);

  addLH(5, 'G2', 'E3', 'A3', 'C#4', 'A/G', '主歌 Verse', '不為誰而作的歌');
  addMel(21.0, 0.5, 'E4', 'C#4', 0.82); addMel(22.0, 0.75, 'G4', 'C#4', 0.86);

  notes.sort((a, b) => a.time - b.time);
  return { title: '林俊傑 JJ Lin – 不為誰而作的歌', duration: 32 * spb, notes, markers };
}

function buildRenCuoAuthenticScore(level = 5) {
  const bpm = 70; const spb = 60 / bpm; const notes = []; const markers = [];
  const add = (beat, durBeats, pitchStr, hand, vel = 0.8) => {
    notes.push({ time: beat * spb, duration: durBeats * spb, midi: typeof pitchStr === 'number' ? pitchStr : n(pitchStr), hand, velocity: vel, played: false });
  };
  add(0, 1, 'C4', 'L', 0.7); add(0, 1, 'E4', 'R', 0.8);
  notes.sort((a, b) => a.time - b.time);
  return { title: '優客李林 – 認錯', duration: 16 * spb, notes, markers: [{time:0, chord:'C', section:'前奏', lyric:'認錯前奏'}] };
}

let currentPreset = 'twilight';
let customMidiData = null;
let currentLevel = 5;
let score = buildTwilightAuthenticScore(5);
let isPlaying = false, currentTime = 0, playbackSpeed = 1.0, enableRH = true, enableLH = true, useJianpu = true, lastFrameTime = performance.now();
const activeTouches = new Set();

function rebuildActiveScore() {
  score = currentPreset === 'rencuo' ? buildRenCuoAuthenticScore(currentLevel) : buildTwilightAuthenticScore(currentLevel);
}

const wfCanvas = document.getElementById('waterfallCanvas');
const kbCanvas = document.getElementById('keyboardCanvas');
const wfCtx = wfCanvas.getContext('2d');
const kbCtx = kbCanvas.getContext('2d');
const MIN_MIDI = 36, MAX_MIDI = 96;
const keyGeometries = {};

function isBlackKey(midi) { return [1, 3, 6, 8, 10].includes(midi % 12); }
function midiToLabel(midi) { return useJianpu ? ['1','#1','2','#2','3','4','#4','5','#5','6','#6','7'][midi % 12] : ''; }

function resizeCanvases() {
  const dpr = window.devicePixelRatio || 1;
  wfCanvas.width = wfCanvas.clientWidth * dpr; wfCanvas.height = wfCanvas.clientHeight * dpr;
  kbCanvas.width = kbCanvas.clientWidth * dpr; kbCanvas.height = kbCanvas.clientHeight * dpr;
  wfCtx.setTransform(dpr, 0, 0, dpr, 0, 0); kbCtx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const W = kbCanvas.clientWidth;
  let whiteCount = 0;
  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) if (!isBlackKey(m)) whiteCount++;
  const whiteW = W / whiteCount;
  let wIdx = 0;
  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
    if (!isBlackKey(m)) { keyGeometries[m] = { x: wIdx * whiteW, w: whiteW, black: false }; wIdx++; }
  }
  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
    if (isBlackKey(m)) {
      const prev = keyGeometries[m - 1];
      const bw = whiteW * 0.62;
      keyGeometries[m] = { x: prev.x + whiteW - bw / 2, w: bw, black: true };
    }
  }
}
window.addEventListener('resize', resizeCanvases);
resizeCanvases();

function renderLoop(now) {
  const dt = (now - lastFrameTime) / 1000; lastFrameTime = now;
  if (isPlaying) {
    currentTime += dt * playbackSpeed;
    if (currentTime >= score.duration) { currentTime = 0; score.notes.forEach(n => n.played = false); }
    for (const note of score.notes) {
      if (!note.played && note.time <= currentTime) {
        note.played = true;
        if ((note.hand === 'R' && enableRH) || (note.hand === 'L' && enableLH)) audio.playNote(note.midi, note.duration / playbackSpeed, note.velocity);
      }
    }
    document.getElementById('seekSlider').value = Math.floor((currentTime / score.duration) * 1000);
  }
  const fmt = s => `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
  document.getElementById('timeDisplay').textContent = `${fmt(currentTime)} / ${fmt(score.duration)}`;
  drawWaterfall(); drawKeyboard();
  requestAnimationFrame(renderLoop);
}

function drawWaterfall() {
  const W = wfCanvas.clientWidth, H = wfCanvas.clientHeight;
  wfCtx.clearRect(0, 0, W, H);
  const lookAhead = 3.2, pxPerSec = H / lookAhead;
  for (const note of score.notes) {
    if (note.hand === 'R' && !enableRH) continue;
    if (note.hand === 'L' && !enableLH) continue;
    if (note.time + note.duration < currentTime || note.time > currentTime + lookAhead) continue;
    const geom = keyGeometries[note.midi]; if (!geom) continue;
    const yBottom = H - (note.time - currentTime) * pxPerSec;
    const noteH = Math.max(14, note.duration * pxPerSec - 3);
    const yTop = yBottom - noteH;
    wfCtx.fillStyle = note.hand === 'R' ? '#00e5ff' : '#ff9d00';
    wfCtx.beginPath(); wfCtx.roundRect(geom.x + 1.5, yTop, geom.w - 3, noteH, 5); wfCtx.fill();
  }
}

function drawKeyboard() {
  const W = kbCanvas.clientWidth, H = kbCanvas.clientHeight;
  kbCtx.clearRect(0, 0, W, H);
  const activeMap = {};
  for (const note of score.notes) {
    if (note.time <= currentTime && note.time + note.duration >= currentTime) activeMap[note.midi] = note.hand;
  }
  activeTouches.forEach(m => activeMap[m] = 'R');
  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
    const g = keyGeometries[m]; if (!g || g.black) continue;
    const ah = activeMap[m];
    kbCtx.fillStyle = ah ? (ah === 'R' ? '#00e5ff' : '#ff9d00') : '#f8fafc';
    kbCtx.fillRect(g.x + 0.5, 0, g.w - 1, H);
    kbCtx.strokeRect(g.x + 0.5, 0, g.w - 1, H);
  }
  const blackH = H * 0.63;
  for (let m = MIN_MIDI; m <= MAX_MIDI; m++) {
    const g = keyGeometries[m]; if (!g || !g.black) continue;
    const ah = activeMap[m];
    kbCtx.fillStyle = ah ? (ah === 'R' ? '#00b8d4' : '#f57c00') : '#111827';
    kbCtx.beginPath(); kbCtx.roundRect(g.x, 0, g.w, blackH, [0, 0, 4, 4]); kbCtx.fill();
  }
}

document.getElementById('playBtn').addEventListener('click', function() {
  audio.init(); isPlaying = !isPlaying; this.textContent = isPlaying ? '⏸ 暫停' : '▶ 播放';
});
document.getElementById('restartBtn').addEventListener('click', () => { currentTime = 0; score.notes.forEach(n => n.played = false); });
document.getElementById('seekSlider').addEventListener('input', e => {
  currentTime = (e.target.value / 1000) * score.duration;
  score.notes.forEach(n => { n.played = n.time < currentTime; });
});
document.getElementById('fsBtn').addEventListener('click', () => {
  if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(()=>{});
  else document.exitFullscreen();
});

rebuildActiveScore();
requestAnimationFrame(renderLoop);
</script>
</body>
</html>
